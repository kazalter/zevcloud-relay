name: Build and deploy relay to Excalibase

on:
  push:
    branches: [main]
    paths:
      - server.js
      - package.json
      - Dockerfile
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kazalter/zevcloud-relay:latest
            ghcr.io/kazalter/zevcloud-relay:${{ github.sha }}
      - uses: excalibase/deploy-action@v1
        with:
          app: proj-ms6hwr3h1x/c2860c01-3ac3-478c-ba85-04d2624b771d
          image: ghcr.io/kazalter/zevcloud-relay@${{ steps.build.outputs.digest }}
          token: ${{ secrets.EXCALIBASE_TOKEN }}
